<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Geist</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Geist</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Noto Sans</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Geist</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Noto Sans Mono</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Roboto</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Geist</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Monaspace Neon</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Monaspace Argon</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Monaspace Xenon</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Monaspace Radon</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Monaspace Krypton</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Menlo</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Monaco</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Fira Code</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Source Code Pro</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Cascadia Code</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Lucida Console</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Iosevka</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Hack</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Anonymous Pro</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
</fontconfig>
