#:schema https://yazi-rs.github.io/schemas/theme.json

[mgr]
cwd = { fg = "#89b4fa", bold = true }

find_keyword  = { fg = "#f9e2af", bold = true, underline = true }
find_position = { fg = "#f5c2e7", bg = "reset", bold = true }

symlink_target = { fg = "#6c7086", italic = true }

marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#94e2d5", bg = "#94e2d5" }
marker_selected = { fg = "#f9e2af", bg = "#f9e2af" }

count_copied   = { fg = "#11111b", bg = "#a6e3a1" }
count_cut      = { fg = "#11111b", bg = "#f38ba8" }
count_selected = { fg = "#11111b", bg = "#f9e2af" }

border_symbol = " "
border_style  = { fg = "#313244" }

[tabs]
active   = { fg = "#11111b", bg = "#cba6f7", bold = true }
inactive = { fg = "#a6adc8", bg = "#313244" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#11111b", bg = "#89b4fa", bold = true }
normal_alt  = { fg = "#89b4fa", bg = "#313244" }
select_main = { fg = "#11111b", bg = "#a6e3a1", bold = true }
select_alt  = { fg = "#a6e3a1", bg = "#313244" }
unset_main  = { fg = "#11111b", bg = "#f38ba8", bold = true }
unset_alt   = { fg = "#f38ba8", bg = "#313244" }

[indicator]
current = { reversed = true }
preview = { fg = "#cdd6f4", bg = "#313244" }
padding = { open = " ", close = " " }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#585b70" }
perm_type  = { fg = "#89b4fa" }
perm_read  = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec  = { fg = "#a6e3a1" }

progress_label  = { fg = "#cdd6f4", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#313244" }
progress_error  = { fg = "#f38ba8", bg = "#313244" }

[which]
cols            = 3
mask            = { bg = "#11111b" }
cand            = { fg = "#94e2d5" }
rest            = { fg = "#6c7086" }
desc            = { fg = "#cba6f7" }
separator       = "  "
separator_style = { fg = "#585b70" }

[confirm]
border  = { fg = "#89b4fa" }
title   = { fg = "#89b4fa" }
btn_yes = { fg = "#11111b", bg = "#a6e3a1", bold = true }
btn_no  = { fg = "#cdd6f4" }

[spot]
border   = { fg = "#89b4fa" }
title    = { fg = "#89b4fa" }
tbl_col  = { fg = "#89b4fa" }
tbl_cell = { fg = "#11111b", bg = "#f9e2af" }

[notify]
title_info  = { fg = "#a6e3a1" }
title_warn  = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

[pick]
border   = { fg = "#89b4fa" }
active   = { fg = "#cba6f7", bold = true }
inactive = { fg = "#cdd6f4" }

[input]
border   = { fg = "#89b4fa" }
title    = { fg = "#cdd6f4" }
value    = { fg = "#cdd6f4" }
selected = { reversed = true }

[cmp]
border   = { fg = "#89b4fa" }
active   = { fg = "#11111b", bg = "#89b4fa" }
inactive = { fg = "#cdd6f4" }

[tasks]
border  = { fg = "#89b4fa" }
title   = { fg = "#cdd6f4" }
hovered = { fg = "#cba6f7", bold = true }

[help]
on      = { fg = "#94e2d5" }
run     = { fg = "#cba6f7" }
desc    = { fg = "#a6adc8" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#11111b", bg = "#a6adc8" }

[filetype]
rules = [
	{ mime = "image/*",           fg = "#f5c2e7" },
	{ mime = "{audio,video}/*",   fg = "#cba6f7" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f38ba8" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#94e2d5" },
	{ mime = "vfs/{absent,stale}", fg = "#6c7086" },

	{ url = "*",  is = "orphan", fg = "#f38ba8", bold = true },
	{ url = "*",  is = "exec",   fg = "#a6e3a1", bold = true },
	{ url = "*",  is = "dummy",  fg = "#f38ba8" },
	{ url = "*/", is = "dummy",  fg = "#f38ba8" },

	{ url = "*/", fg = "#89b4fa", bold = true },
]
